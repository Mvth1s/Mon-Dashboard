name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    # Les images Ubuntu des runners ne fournissent que libadwaita 1.5, alors
    # que la couleur d'accentuation du système exige la 1.6. On construit donc
    # dans un conteneur Fedora, qui suit les versions de GNOME.
    container: fedora:latest

    steps:
      - name: Dépendances système (GTK4 + libadwaita)
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config gtk4-devel libadwaita-devel \
            git tar xz zstd findutils

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy sans NVIDIA
        run: cargo clippy -p mondashboard-core --no-default-features -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --workspace
