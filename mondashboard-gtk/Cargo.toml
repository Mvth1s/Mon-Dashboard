[package]
name = "mondashboard-gtk"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mondashboard"
path = "src/main.rs"

[dependencies]
mondashboard-core = { path = "../mondashboard-core" }
gtk4 = { version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
sysinfo = "0.33"
serde_json = "1"
glib = "0.20"
log = "0.4"
env_logger = "0.11"
notify-rust = "4"
ksni = { version = "0.3.6", features = ["blocking"] }
