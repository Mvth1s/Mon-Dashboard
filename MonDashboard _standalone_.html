  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  /* GNOME blue   */\n    --green:            #2ec27e;  /* success      */\n    --orange:          #ff7800;  /* warning      */\n    --red:              #e01b24;  /* error        */\n\n    --radius-window:    13px;\n    --radius-card:      12px;\n    --radius-sm:        8px;\n\n    --shadow-window: 0 0 0 1px rgba(0,0,0,0.5), 0 14px 40px 6px rgba(0,0,0,0.55), 0 4px 12px rgba(0,0,0,0.4);\n  }\n\n  * { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html, body {\n    height: 100%;\n    font-family: \"Cantarell\", \"Segoe UI\", system-ui, sans-serif;\n    color: var(--window-fg);\n    -webkit-font-smoothing: antialiased;\n  }\n\n  /* desktop backdrop the window floats on */\n  body {\n    min-height: 100vh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 36px;\n    background:\n      radial-gradient(1200px 800px at 22% 12%, #34303d 0%, transparent 60%),\n      radial-gradient(1000px 700px at 85% 90%, #1f2a33 0%, transparent 55%),\n      #15161a;\n  }\n\n  /* ===================== window ===================== */\n  .window {\n    width: min(1240px, 100%);\n    background: var(--window-bg);\n    border-radius: var(--radius-window);\n    box-shadow: var(--shadow-window);\n    overflow: hidden;\n    display: flex;\n    flex-direction: column;\n  }\n\n  /* ---------------- AdwHeaderBar ---------------- */\n  .headerbar {\n    height: 47px;\n    flex: 0 0 47px;\n    display: grid;\n    grid-template-columns: 1fr auto 1fr;\n    align-items: center;\n    padding: 0 8px;\n    background: var(--headerbar-bg);\n    border-bottom: 1px solid var(--headerbar-border);\n    position: relative;\n  }\n  .hb-left  { display: flex; align-items: center; gap: 4px; justify-self: start; }\n  .hb-right { display: flex; align-items: center; gap: 6px; justify-self: end; }\n\n  .hb-title {\n    font-size: 0.94rem;\n    font-weight: 700;\n    letter-spacing: 0.01em;\n    text-align: center;\n    white-space: nowrap;\n  }\n  .hb-title .sub {\n    display: block;\n    font-size: 0.72rem;\n    font-weight: 400;\n    color: var(--dim);\n    letter-spacing: 0;\n    margin-top: -1px;\n  }\n\n  /* flat icon buttons */\n  .icon-btn {\n    width: 34px; height: 34px;\n    border: none;\n    background: transparent;\n    color: var(--window-fg);\n    border-radius: var(--radius-sm);\n    display: flex; align-items: center; justify-content: center;\n    cursor: pointer;\n    transition: background .12s ease;\n  }\n  .icon-btn:hover  { background: rgba(255,255,255,0.09); }\n  .icon-btn:active { background: rgba(255,255,255,0.14); }\n  .icon-btn svg { width: 16px; height: 16px; }\n\n  /* pill dropdown (layout selector) */\n  .dropdown { position: relative; }\n  .layout-btn {\n    height: 34px;\n    display: flex; align-items: center; gap: 7px;\n    padding: 0 9px 0 12px;\n    border: none;\n    background: rgba(255,255,255,0.09);\n    color: var(--window-fg);\n    border-radius: var(--radius-sm);\n    font-family: inherit;\n    font-size: 0.86rem;\n    font-weight: 700;\n    cursor: pointer;\n    transition: background .12s ease;\n  }\n  .layout-btn:hover { background: rgba(255,255,255,0.14); }\n  .layout-btn .chev { width: 13px; height: 13px; opacity: .8; transition: transform .15s ease; }\n  .dropdown.open .layout-btn .chev { transform: rotate(180deg); }\n\n  .menu {\n    position: absolute;\n    top: 40px; right: 0;\n    min-width: 178px;\n    background: #383838;\n    border: 1px solid rgba(0,0,0,0.4);\n    border-radius: 10px;\n    padding: 6px;\n    box-shadow: 0 8px 24px rgba(0,0,0,0.5);\n    display: none;\n    z-index: 40;\n  }\n  .dropdown.open .menu { display: block; }\n  .menu-item {\n    display: flex; align-items: center; gap: 9px;\n    padding: 7px 9px;\n    border-radius: 6px;\n    font-size: 0.88rem;\n    cursor: pointer;\n    color: var(--window-fg);\n  }\n  .menu-item:hover { background: rgba(255,255,255,0.09); }\n  .menu-item .check { width: 14px; height: 14px; opacity: 0; color: var(--accent); }\n  .menu-item.active .check { opacity: 1; }\n  .menu-item.active { font-weight: 700; }\n\n  /* ===================== content / grid ===================== */\n  .content {\n    background: var(--view-bg);\n    padding: 14px;\n    display: grid;\n    grid-template-columns: repeat(12, 1fr);\n    grid-auto-rows: 150px;\n    gap: 14px;\n  }\n\n  .card {\n    background: var(--card-bg);\n    border: 1px solid var(--border);\n    border-radius: var(--radius-card);\n    padding: 15px 16px;\n    display: flex;\n    flex-direction: column;\n    min-width: 0;\n    transition: background .14s ease, border-color .14s ease;\n  }\n  .card:hover { background: var(--card-bg-hover); border-color: rgba(255,255,255,0.13); }\n\n  .card-head {\n    display: flex; align-items: center; justify-content: space-between;\n    margin-bottom: 9px;\n  }\n  .card-title {\n    font-size: 0.74rem;\n    font-weight: 700;\n    letter-spacing: 0.07em;\n    text-transform: uppercase;\n    color: var(--dim);\n    display: flex; align-items: center; gap: 7px;\n  }\n  .card-title svg { width: 14px; height: 14px; opacity: .8; }\n\n  .badge {\n    font-size: 0.7rem;\n    font-weight: 700;\n    padding: 2px 7px;\n    border-radius: 999px;\n    color: #fff;\n  }\n\n  /* big metric value */\n  .metric { font-size: 2.45rem; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }\n  .metric .unit { font-size: 1.1rem; font-weight: 400; color: var(--dim); }\n  .subtext { font-size: 0.76rem; color: var(--dim); line-height: 1.4; margin-top: auto; }\n  .subtext .mono { font-family: \"Source Code Pro\", monospace; }\n\n  /* progress bar */\n  .bar { height: 6px; border-radius: 99px; background: var(--track); overflow: hidden; margin: 11px 0 9px; }\n  .bar > span { display: block; height: 100%; border-radius: 99px; transition: width .6s cubic-bezier(.2,.7,.3,1), background-color .4s; }\n  .fill-green  { background: var(--green);  }\n  .fill-orange { background: var(--orange); }\n  .fill-red    { background: var(--red);    }\n  .fill-blue   { background: var(--accent); }\n\n  /* segmented bar (RAM) */\n  .bar.seg { display: flex; gap: 2px; background: transparent; }\n  .bar.seg > span { transition: width .6s ease; }\n  .seg-used  { background: var(--accent); }\n  .seg-cache { background: rgba(255,255,255,0.22); }\n  .seg-free  { background: rgba(255,255,255,0.07); }\n\n  .legend { display: flex; gap: 14px; font-size: 0.72rem; color: var(--dim); margin-top: auto; }\n  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }\n\n  /* ---- grid placement ---- */\n  .cpu  { grid-column: span 3; }\n  .ram  { grid-column: span 3; }\n  .gpu  { grid-column: span 6; }\n  .net  { grid-column: span 4; }\n  .batt { grid-column: span 4; }\n  .fans { grid-column: span 4; }\n  .storage { grid-column: span 12; grid-row: span 2; }\n  .proc    { grid-column: span 12; grid-row: span 2; }\n\n  /* ---- GPU split ---- */\n  .gpu-split { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 18px; flex: 1; align-items: stretch; }\n  .gpu-div { background: var(--border); }\n  .gpu-col { display: flex; flex-direction: column; min-width: 0; }\n  .gpu-name { font-size: 0.82rem; font-weight: 700; margin-bottom: 2px; }\n  .gpu-pct  { font-size: 1.7rem; font-weight: 700; line-height: 1; }\n\n  /* ---- network ---- */\n  .net-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; flex: 1; align-content: center; }\n  .net-stat .lbl { font-size: 0.72rem; color: var(--dim); display: flex; align-items: center; gap: 5px; }\n  .net-stat .val { font-size: 1.15rem; font-weight: 700; margin-top: 2px; }\n  .net-stat .val.mono, .net-stat .lbl .mono { font-family: \"Source Code Pro\", monospace; }\n  .arrow { font-weight: 700; }\n  .arrow.dn { color: var(--green); }\n  .arrow.up { color: var(--dim); }\n\n  /* ---- battery ---- */\n  .batt-row { display: flex; align-items: center; gap: 14px; }\n  .batt-glyph { position: relative; width: 52px; height: 26px; border: 2px solid var(--window-fg); border-radius: 5px; flex: 0 0 auto; }\n  .batt-glyph::after { content:\"\"; position: absolute; right: -5px; top: 7px; width: 3px; height: 10px; background: var(--window-fg); border-radius: 0 2px 2px 0; }\n  .batt-glyph > i { position: absolute; inset: 2px; width: var(--lvl,78%); background: var(--green); border-radius: 2px; }\n  .batt-bolt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #07150d; }\n  .batt-meta { display: flex; gap: 22px; margin-top: auto; }\n  .batt-meta .k { font-size: 0.72rem; color: var(--dim); }\n  .batt-meta .v { font-size: 0.95rem; font-weight: 700; }\n\n  /* ---- fans ---- */\n  .fan-list { display: flex; flex-direction: column; gap: 0; flex: 1; justify-content: center; }\n  .fan-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }\n  .fan-item:last-child { border-bottom: none; }\n  .fan-name { display: flex; align-items: center; gap: 9px; font-size: 0.88rem; }\n  .fan-blade { width: 15px; height: 15px; color: var(--dim); animation: spin 2.4s linear infinite; }\n  .fan-rpm { font-family: \"Source Code Pro\", monospace; font-weight: 500; font-size: 0.9rem; }\n  .fan-rpm .u { color: var(--dim); font-size: 0.74rem; }\n  @keyframes spin { to { transform: rotate(360deg); } }\n\n  /* ---- storage ---- */\n  .storage .card-body { display: flex; flex-direction: column; gap: 4px; flex: 1; justify-content: center; }\n  .part {\n    display: grid;\n    grid-template-columns: 230px 1fr 150px;\n    align-items: center;\n    gap: 18px;\n    padding: 12px 4px;\n    border-bottom: 1px solid var(--border);\n  }\n  .part:last-child { border-bottom: none; }\n  .part-id { display: flex; align-items: center; gap: 11px; min-width: 0; }\n  .part-icon { width: 30px; height: 30px; border-radius: 7px; background: rgba(255,255,255,0.07); display: flex; align-items: center; justify-content: ce y id=\"procBody\">\n            <tr data-name=\"firefox\">\n              <td><span class=\"proc-name\"><span class=\"proc-dot\" style=\"background:var(--orange)\"><\u002Fspan>firefox<\u002Fspan><\u002Ftd>\n              <td class=\"num\"><span class=\"pct-cell\"><span class=\"micro-bar\"><span class=\"fill-orange\" style=\"width:62%\"><\u002Fspan><\u002Fspan>18.4<\u002Fspan><\u002Ftd>\n              <td class=\"num mono\">2.1 Go<\u002Ftd>\n              <td><span class=\"user-tag\">tux<\u002Fspan><\u002Ftd>\n            <\u002Ftr>\n            <tr data-name=\"code\">\n              <td><span class=\"proc-name\"><span class=\"proc-dot\" style=\"background:var(--accent)\"><\u002Fspan>code<\u002Fspan><\u002Ftd>\n              <td class=\"num\"><span class=\"pct-cell\"><span class=\"micro-bar\"><span class=\"fill-green\" style=\"width:42%\"><\u002Fspan><\u002Fspan>12.7<\u002Fspan><\u002Ftd>\n              <td class=\"num mono\">1.4 Go<\u002Ftd>\n              <td><span class=\"user-tag\">tux<\u002Fspan><\u002Ftd>\n            <\u002Ftr>\n            <tr data-name=\"ollama\">\n              <td><span class=\"proc-name\"><span class=\"proc-dot\" style=\"background:var(--red)\"><\u002Fspan>ollama<\u002Fspan><\u002Ftd>\n              <td class=\"num\"><span class=\"pct-cell\"><span class=\"micro-bar\"><span class=\"fill-red\" style=\"width:88%\"><\u002Fspan><\u002Fspan>89.2<\u002Fspan><\u002Ftd>\n              <td class=\"num mono\">5.8 Go<\u002Ftd>\n              <td><span class=\"user-tag\">tux<\u002Fspan><\u002Ftd>\n            <\u002Ftr>\n            <tr data-name=\"kwin_wayland\">\n              <td><span class=\"proc-name\"><span class=\"proc-dot\" style=\"background:var(--green)\"><\u002Fspan>kwin_wayland<\u002Fspan><\u002Ftd>\n              <td class=\"num\"><span class=\"pct-cell\"><span class=\"micro-bar\"><span class=\"fill-green\" style=\"width:18%\"><\u002Fspan><\u002Fspan>4.1<\u002Fspan><\u002Ftd>\n              <td class=\"num mono\">680 Mo<\u002Ftd>\n              <td><span class=\"user-tag\">tux<\u002Fspan><\u002Ftd>\n            <\u002Ftr>\n            <tr data-name=\"pipewire\">\n              <td><span class=\"proc-name\"><span class=\"proc-dot\" style=\"background:var(--green)\"><\u002Fspan>pipewire<\u002Fspan><\u002Ftd>\n              <td class=\"num\"><span class=\"pct-cell\"><span class=\"micro-bar\"><span class=\"fill-green\" style=\"width:7%\"><\u002Fspan><\u002Fspan>1.3<\u002Fspan><\u002Ftd>\n              <td class=\"num mono\">42 Mo<\u002Ftd>\n              <td><span class=\"user-tag\">root<\u002Fspan><\u002Ftd>\n            <\u002Ftr>\n            <tr data-name=\"systemd\">\n              <td><span class=\"proc-name\"><span class=\"proc-dot\" style=\"background:var(--green)\"><\u002Fspan>systemd<\u002Fspan><\u002Ftd>\n              <td class=\"num\"><span class=\"pct-cell\"><span class=\"micro-bar\"><span class=\"fill-green\" style=\"width:3%\"><\u002Fspan><\u002Fspan>0.6<\u002Fspan><\u002Ftd>\n              <td class=\"num mono\">18 Mo<\u002Ftd>\n              <td><span class=\"user-tag\">root<\u002Fspan><\u002Ftd>\n            <\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n  /* ---- helpers ---- */\n  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));\n  function colorClass(p) { return p < 60 ? 'fill-green' : p <= 85 ? 'fill-orange' : 'fill-red'; }\n  function setGauge(barId, valId, p, opts={}) {\n    const bar = document.getElementById(barId);\n    const val = document.getElementById(valId);\n    if (bar) { bar.style.width = p + '%'; bar.className = colorClass(p); }\n    if (val) val.textContent = Math.round(p);\n  }\n\n  /* ---- live-feel random walk ---- */\n  let cpu = 42, gpu = 67, igpu = 12, batt = 78;\n  function tick() {\n    cpu  = clamp(cpu  + (Math.random()-0.5)*9, 8, 96);\n    gpu  = clamp(gpu  + (Math.random()-0.5)*8, 20, 95);\n    igpu = clamp(igpu + (Math.random()-0.5)*6, 4, 40);\n\n    setGauge('cpu-bar','cpu-val', cpu);\n    setGauge('dgpu-bar','dgpu-val', gpu);\n    setGauge('igpu-bar','igpu-val', igpu);\n\n    document.getElementById('cpu-temp').textContent  = Math.round(48 + cpu*0.18);\n    document.getElementById('dgpu-temp').textContent = Math.round(58 + gpu*0.22);\n\n    // network\n    document.getElementById('net-dn').textContent   = (40 + Math.random()*18).toFixed(1);\n    document.getElementById('net-up').textContent   = (2 + Math.random()*3).toFixed(1);\n    document.getElementById('net-ping').textContent = Math.round(9 + Math.random()*9);\n\n    // overlay mirror\n    const ob = document.getElementById('o-cpu-bar'); ob.style.width = cpu+'%'; ob.className = colorClass(cpu);\n    document.getElementById('o-cpu').textContent = Math.round(cpu)+'%';\n    const og = document.getElementById('o-gpu-bar'); og.style.width = gpu+'%'; og.className = colorClass(gpu);\n    document.getElementById('o-gpu').textContent = Math.round(gpu)+'%';\n  }\n  setInterval(tick, 1400);\n\n  /* ---- layout dropdown ---- */\n  const dd = document.getElementById('layoutDropdown');\n  document.getElementById('layoutBtn').addEventListener('click', e => { e.stopPropagation(); dd.classList.toggle('open'); });\n  document.querySelectorAll('#layoutMenu .menu-item').forEach(item => {\n    item.addEventListener('click', () => {\n      document.querySelectorAll('#layoutMenu .menu-item').forEach(i => i.classList.remove('active'));\n      item.classList.add('active');\n      document.getElementById('layoutLabel').textContent = item.dataset.layout;\n      dd.classList.remove('open');\n    });\n  });\n  document.addEventListener('click', () => dd.classList.remove('open'));\n\n  /* ---- process search ---- */\n  document.getElementById('procSearch').addEventListener('input', e => {\n    const q = e.target.value.toLowerCase().trim();\n    document.querySelectorAll('#procBody tr').forEach(tr => {\n      tr.style.display = tr.dataset.name.includes(q) ? '' : 'none';\n    });\n  });\n\n  /* ---- draggable overlay ---- */\n  (function(){\n    const o = document.getElementById('overlay');\n    let dx=0, dy=0, dragging=false;\n    o.addEventListener('pointerdown', e => {\n      dragging=true; o.style.cursor='grabbing';\n      dx = e.clientX - o.offsetLeft; dy = e.clientY - o.offsetTop;\n      o.setPointerCapture(e.pointerId);\n    });\n    o.addEventListener('pointermove', e => {\n      if(!dragging) return;\n      o.style.left = (e.clientX - dx) + 'px';\n      o.style.top  = (e.clientY - dy) + 'px';\n      o.style.right = 'auto';\n    });\n    o.addEventListener('pointerup', e => { dragging=false; o.style.cursor='grab'; });\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
