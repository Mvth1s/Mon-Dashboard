[package]
name = "mondashboard-core"
version = "0.1.0"
edition = "2024"

[dependencies]
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dependencies.nvml-wrapper]
version = "0.10"
optional = true

[features]
default = ["nvidia"]
nvidia = ["nvml-wrapper"]
